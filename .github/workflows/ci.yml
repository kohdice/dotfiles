name: CI
on:
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - lib/**
      - modules/**
      - users/**
      - .github/workflows/ci.yml
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            system: x86_64-linux
          - name: macOS
            os: macos-latest
            system: aarch64-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - name: Check format
        run: nix fmt -- --ci
      - name: Flake check
        run: nix flake check --system ${{ matrix.system }} --show-trace
