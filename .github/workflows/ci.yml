name: CI
on:
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - lib/**
      - modules/**
      - users/**
      - .github/workflows/ci.yml
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            system: x86_64-linux
          # macOS is disabled until marksman builds successfully on aarch64-darwin.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
      - name: Check format
        run: nix fmt -- --ci
      - name: Flake check
        run: nix flake check --system ${{ matrix.system }} --show-trace
