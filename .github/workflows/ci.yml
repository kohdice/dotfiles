name: CI
on:
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - lib/**
      - modules/**
      - users/**
      - .github/workflows/ci.yml
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            system: x86_64-linux
          # macOS is disabled until marksman builds successfully on aarch64-darwin.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: false
      - name: Check format
        run: nix fmt -- --ci
      - name: Flake check
        run: nix flake check --system ${{ matrix.system }} --show-trace
