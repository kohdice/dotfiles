# BACKUP ONLY -- this file is NOT symlinked anywhere.
# The live config (~/.config/jj/config.toml) is generated by home-manager
# (modules/home/jj/default.nix). user.email is injected per profile from
# users/<name>/info.nix; the value below is the personal (kohdice) default.
# Edit the Nix module instead; keep this file in sync for non-Nix setups.

[user]
name = "kohdice"
email = "k@kohdice.com"

[signing]
backend = "ssh"
behavior = "own"
key = "~/.ssh/id_ed25519.pub"

[ui]
editor = "nvim"
pager = "delta"
diff-formatter = ":git"
